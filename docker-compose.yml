name: dai

services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: dai-backend:local
    command: ["python", "-m", "pipeline.run", "--data", "task/data", "--out", "outputs", "--method", "${PIPELINE_METHOD:-v1}"]
    volumes:
      - ./task/data:/app/task/data:ro
      - ./outputs:/app/outputs
    restart: "no"

  api:
    image: dai-backend:local
    pull_policy: never            # образ собирает сервис pipeline
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - ./task/data:/app/task/data:ro
      - ./outputs:/app/outputs:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: dai-web:local
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
